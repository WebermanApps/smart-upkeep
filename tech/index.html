.big{font-family:"Khand",sans-serif;font-size:2.4rem;font-weight:700;color:var(--lagoon);line-height:1}

/* Polish pass (Max 20:04 ICT Oct 15): one spacing/radius scale, clearer type steps, 44px+ tap targets, even icon sizes,
   no overflow at 360px, tabs sit below content (sticky, never covering it), soft fade between tabs, crisp desktop frame. Colors, fonts and header unchanged. */
:root{--r:16px;--r-sm:12px;--gap:12px;--pad:16px}
.body{padding:4px 16px 24px}
.top{padding:40px 16px 8px}
.card{border-radius:var(--r);padding:var(--pad);margin:0 0 var(--gap)}
.hello{font-size:clamp(1.75rem,7vw,2.1rem);margin:6px 0 var(--gap)}
.sec{font-size:1.75rem;margin:8px 0 var(--gap)}
h3{font-size:1.3rem;margin:0 0 6px}
.lbl{font-size:.74rem;margin-bottom:4px;overflow-wrap:anywhere}
.note{font-size:.84rem;line-height:1.45}
.li{min-height:52px}.li .t{overflow-wrap:anywhere}.li .t small{display:block;line-height:1.35;margin-top:1px}
.li>.su-ico.sm,.li .pic .su-ico{width:1.5rem;height:1.5rem}
.qa{gap:var(--gap);margin:0 0 var(--gap)}.qa button{border-radius:var(--r);min-height:96px;padding:12px 6px;text-align:center;line-height:1.2}.qa .su-ico{width:2rem;height:2rem}
.hint{border-radius:var(--r);margin:0 0 var(--gap)!important}.hint .su-ico{margin-top:2px}
.share,.back{min-height:44px}
.back{margin:4px 0 8px}
.link{min-height:44px;display:inline-flex;align-items:center}
.pl{min-height:44px}.pills{margin:0 0 var(--gap);padding:2px 0}
.add-btn{min-height:44px;min-width:64px}
.toggle{width:52px;height:32px}.toggle:after{top:4px;left:4px;width:24px;height:24px}.toggle.on:after{left:24px}
.btn{min-height:52px;border-radius:var(--r-sm)}
.warr-banner{border-radius:var(--r);margin:0 0 var(--gap)}
.fold{margin:0 0 10px}
.ref{border-radius:var(--r-sm)}
.ph div{border-radius:var(--r-sm)}
.tabs{position:sticky;bottom:0;left:auto;transform:none;max-width:none;margin-top:auto;z-index:40}
@media(min-width:700px){.tabs{bottom:0;border-radius:0}}

.toast{bottom:96px}
