<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Ethan Monarch">
  <rect width="128" height="128" fill="#FBF8F3"/>
  <!-- shoulders / terracotta polo -->
  <path d="M14 118c8-28 28-42 50-42s42 14 50 42" fill="#C1502E"/>
  <path d="M44 86c6 8 14 12 20 12s14-4 20-12" fill="none" stroke="#A8431F" stroke-width="2" stroke-linecap="round"/>
  <!-- neck -->
  <path d="M54 78c4 8 16 8 20 0" fill="#E8C4A8"/>
  <!-- head -->
  <ellipse cx="64" cy="52" rx="28" ry="32" fill="#F0D0B4"/>
  <!-- hair -->
  <path d="M36 48c2-22 18-34 28-34 12 0 26 10 28 30-6-10-14-14-28-12-10 1-18 6-28 16z" fill="#3A322C"/>
  <!-- ears -->
  <ellipse cx="35" cy="54" rx="5" ry="7" fill="#E8C4A8"/>
  <ellipse cx="93" cy="54" rx="5" ry="7" fill="#E8C4A8"/>
  <!-- eyes -->
  <ellipse cx="52" cy="52" rx="3.2" ry="3.6" fill="#1D1A16"/>
  <ellipse cx="76" cy="52" rx="3.2" ry="3.6" fill="#1D1A16"/>
  <ellipse cx="51.2" cy="51" rx="1" ry="1.1" fill="#fff"/>
  <ellipse cx="75.2" cy="51" rx="1" ry="1.1" fill="#fff"/>
  <!-- brows -->
  <path d="M44 45c5-3 11-3 15 0" fill="none" stroke="#3A322C" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M69 45c5-3 11-3 15 0" fill="none" stroke="#3A322C" stroke-width="2.2" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M64 54c0 6 3 8 5 9" fill="none" stroke="#C4A08A" stroke-width="2" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M52 68c6 6 18 6 24 0" fill="none" stroke="#A8431F" stroke-width="2.4" stroke-linecap="round"/>
  <!-- collar hint -->
  <path d="M54 90l10 10 10-10" fill="none" stroke="#FAF6EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
