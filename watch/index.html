<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex,nofollow">
<title>Smart Upkeep</title>
<meta name="description" content="Coming Soon to Metro Detroit">
<meta property="og:title" content="Smart Upkeep">
<meta property="og:description" content="Coming Soon to Metro Detroit">
<meta property="og:image" content="http://smartupkeep.ai/assets/poster-16x9.jpg">
<meta property="og:url" content="http://smartupkeep.ai/watch/">
<meta property="og:type" content="video.other">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Smart Upkeep">
<meta name="twitter:description" content="Coming Soon to Metro Detroit">
<meta name="twitter:image" content="http://smartupkeep.ai/assets/poster-16x9.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Khand:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#0a0a0a;font-family:"Hind",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{padding:1rem;display:flex;justify-content:center}
header img{height:44px;width:auto}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:0 1rem 1.5rem;text-align:center}
.vw{margin:0 auto;background:#fff;border:1px solid #e5e0d8}
video{display:block;width:100%;height:auto;max-height:72vh;object-fit:contain;background:#f5f0ea}
.portrait .vw{max-width:420px}
h1{font-family:"Khand",sans-serif;font-weight:700;font-size:clamp(1.6rem,4.5vw,2.4rem);margin:1.1rem 0 .9rem;line-height:1.1}
h1 span{display:block;width:48px;height:3px;background:#C1502E;margin:.5rem auto 0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;min-width:180px;padding:.8rem 1.6rem;font:600 .9rem "Hind",sans-serif;text-transform:uppercase;letter-spacing:.1em;background:#C1502E;color:#fff;border:2px solid #C1502E;cursor:pointer}
.mw-hover{transition:transform .15s,box-shadow .15s}
.mw-hover:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(10,10,10,.12)}
.start{font:600 1.05rem "Hind",sans-serif;margin:-.3rem 0 1rem}
.acts{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
a.btn{text-decoration:none}
.btn-o{background:#fff;color:#0a0a0a;border-color:#0a0a0a}
.msg{display:block;min-height:1.4em;margin-top:.5rem;font-size:.9rem;color:#0B6E4F}
footer{text-align:center;padding:1rem;font-size:.85rem;border-top:1px solid #e5e0d8}
footer a{color:#A8431F;text-decoration:none;border-bottom:1px solid rgba(168,67,31,.4)}
@media(prefers-reduced-motion:reduce){.mw-hover{transition:none}.mw-hover:hover{transform:none}}
</style>
</head>
<body>
<header><img src="../assets/A-roof-chevron.svg" alt="Smart Upkeep"></header>
<main id="m">
  <div class="vw"><video id="v" controls playsinline preload="metadata" poster="../assets/poster-16x9.jpg"></video></div>
  <h1>Coming Soon to Metro Detroit<span aria-hidden="true"></span></h1>
  <p class="start">Membership Starting at $99/Month</p>
  <div class="acts"><a class="btn mw-hover" href="../">Get Started</a><button id="share" class="btn btn-o mw-hover" type="button">Share</button></div>
  <span id="msg" class="msg" role="status"></span>
</main>
<script>
(function(){
  var v=document.getElementById("v"),m=document.getElementById("m");
  var port=false; /* upkeep-7 pick 39: wide 16:9 player with title on every screen */
  v.poster="../assets/poster-"+(port?"9x16":"16x9")+".jpg";
  v.src="../video/explainer-"+(port?"9x16":"16x9")+".mp4";
  if(port)m.classList.add("portrait");
  var url="http://smartupkeep.ai/watch/",msg=document.getElementById("msg");
  document.getElementById("share").addEventListener("click",function(){
    if(navigator.share){navigator.share({title:"Smart Upkeep",text:"Coming Soon to Metro Detroit",url:url}).catch(function(){});return;}
    var done=function(){msg.textContent="Link Copied";setTimeout(function(){msg.textContent=""},2500)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(done,function(){prompt("Copy this link:",url)});
    else prompt("Copy this link:",url);
  });
})();
</script>
</body>
</html>
