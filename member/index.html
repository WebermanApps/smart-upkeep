<style>
:root{--saffron:#D4A017;--saffron-d:#8a6510;--lagoon:#05668D;--terra:#C1502E;--cream:#FAF3EB;--ink:#0a0a0a;--mute:#525252;--line:#e5e0d8;--jungle:#0B6E4F}
*{box-sizing:border-box}html,body{overflow-x:hidden}
body{margin:0;background:#efe7dc;color:var(--ink);font-family:"Hind",system-ui,sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3{font-family:"Khand",sans-serif;font-weight:700;line-height:1.1;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.su-ico{width:2.2rem;height:2.2rem;flex:none;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;color:#1f1b17;overflow:visible}
.su-ico .f-t{fill:var(--terra);stroke:#1f1b17}.su-ico .f-l{fill:var(--lagoon);stroke:#1f1b17}.su-ico .f-s{fill:var(--saffron);stroke:#1f1b17}.su-ico .f-j{stroke:var(--jungle)}
.su-ico.sm{width:1.5rem;height:1.5rem;stroke-width:2.5}
.phone{max-width:480px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;display:flex;flex-direction:column}
@media(min-width:700px){body{padding:24px 0}.phone{min-height:calc(100vh - 48px);border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.15);overflow:hidden}}
.tag{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:50;background:#fff;border:1px solid var(--saffron);color:var(--saffron-d);font-size:.72rem;font-weight:600;padding:2px 10px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
.scr{display:none;flex:1;flex-direction:column}.scr.on{display:flex}
.top{display:flex;align-items:center;justify-content:space-between;padding:40px 18px 8px}
.top img{height:30px}
.share{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid #d4d4d4;border-radius:999px;background:#fff;font-weight:600;font-size:.88rem}
.body{flex:1;padding:6px 18px 110px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.plan{background:var(--saffron);border-color:var(--saffron);color:#1f1b17}
.plan h2{font-size:1.9rem}.plan .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:.92rem}
.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--mute)}
.plan .lbl{color:#3b2e05}
.hello{font-size:2rem;margin-top:4px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:.85rem;min-height:92px}
.hint{display:flex;gap:10px;align-items:flex-start;background:#e6f0f4;border:1px solid #b9d5e0;border-radius:14px;padding:12px;font-size:.92rem}
.hint b{color:var(--lagoon)}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.li:first-of-type{border-top:0}
.li .t{flex:1;min-width:0}.li .t b{display:block}.li .t small{color:var(--mute)}
button.li{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;padding:12px 0}
.pill{font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.ok{background:#e3f1ea;color:var(--jungle)}.warn{background:#fbf0d3;color:var(--saffron-d)}.blue{background:#e6f0f4;color:var(--lagoon)}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:12px;border:2px solid var(--saffron);background:var(--saffron);color:#1f1b17;font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.9rem}
.btn.o{background:#fff;border-color:var(--lagoon);color:var(--lagoon)}
.link{background:none;border:0;color:var(--lagoon);font-weight:600;padding:8px;text-decoration:underline}
h3{font-size:1.35rem;margin-bottom:4px}
.sec{font-size:1.6rem;margin:10px 0 0}
ul.chk{list-style:none;padding:0;margin:6px 0}ul.chk li{padding:6px 0 6px 28px;position:relative;border-top:1px solid var(--line);font-size:.93rem}ul.chk li:before{content:"";position:absolute;left:4px;top:11px;width:12px;height:7px;border-left:2.5px solid var(--jungle);border-bottom:2.5px solid var(--jungle);transform:rotate(-45deg)}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ph div{aspect-ratio:1;border-radius:10px;background:repeating-linear-gradient(45deg,#f1ebe2,#f1ebe2 8px,#e9e1d5 8px,#e9e1d5 16px);display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--mute);text-align:center;padding:4px}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
@media(min-width:700px){.tabs{bottom:24px;border-radius:0 0 28px 28px}}
.tabs button{flex:1;min-width:0;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.68rem;font-weight:600;color:var(--mute);min-height:52px;padding:4px 0}
.tabs button .su-ico{width:1.5rem;height:1.5rem;stroke-width:2.5;color:var(--mute)}
.tabs button.on{color:var(--terra)}.tabs button.on .su-ico{color:var(--terra)}
.login{padding:70px 24px 30px;flex:1;display:flex;flex-direction:column}
.login img{height:64px;margin:0 auto 10px;display:block}
.login h1{text-align:center;font-size:2rem;margin-bottom:18px}
.fld{display:block;margin-bottom:12px}.fld span{display:block;font-weight:600;font-size:.88rem;margin-bottom:4px}
.fld input{width:100%;min-height:50px;border:1px solid #cfc6b8;border-radius:12px;padding:0 14px;font:inherit;background:#fff}
.fld input:focus{outline:2px solid var(--lagoon);border-color:var(--lagoon)}
.or{text-align:center;color:var(--mute);font-size:.85rem;margin:12px 0}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border:1px solid #d4d4d4;border-radius:999px;background:#fff;font-weight:600}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f1b17;color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:60;display:none;max-width:90vw;text-align:center}
footer{text-align:center;padding:14px;font-size:.85rem}footer a{color:#A8431F;text-decoration:none;border-bottom:1px solid rgba(168,67,31,.4)}
.toggle{width:46px;height:28px;border-radius:999px;background:#d4d4d4;border:0;position:relative;flex:none}.toggle:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}.toggle.on{background:var(--lagoon)}.toggle.on:after{left:21px}
.ref{font-family:monospace;background:#f6f1ea;border:1px dashed #cfc6b8;border-radius:10px;padding:10px;word-break:break-all;font-size:.9rem;margin:8px 0}
.pills{display:flex;gap:8px;overflow-x:auto;margin:12px 0;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pl{flex:none;border:1.5px solid var(--saffron);background:#fff;color:#1f1b17;border-radius:999px;padding:8px 14px;font-weight:600;font-size:.88rem;min-height:40px}.pl.on{background:var(--saffron)}
.fold{padding:0}.fold summary{list-style:none;cursor:pointer;padding:12px 14px;border:0}.fold summary::-webkit-details-marker{display:none}
.fold .pic{width:44px;height:44px;border-radius:10px;background:var(--cream);display:grid;place-items:center;flex:none}
.fold .chev{margin-left:auto;font-size:1.3rem;color:var(--lagoon);transition:transform .15s}.fold[open] .chev{transform:rotate(90deg)}
.fold-b{padding:0 14px 12px 70px;font-size:.9rem;display:grid;gap:4px}
.warr-banner{display:flex;gap:10px;align-items:flex-start;background:var(--lagoon);color:#fff;border-radius:12px;padding:12px 14px;margin:14px 0}.warr-banner .su-ico{color:#fff;flex:none}
.big{font-family:"Khand",sans-serif;font-size:2.4rem;font-weight:700;color:var(--lagoon);line-height:1}
.note{font-size:.82rem;color:var(--mute)}
</style>
</head>

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
/* SAMPLE member data (all fake) */

var past=[
 {id:"v2",date:"Sep 18, 2026",season:"Fall Visit",items:["Fall furnace tune-up","Furnace filter changed","Gutter and downspout cleaning","Water softener salt topped off","Fridge water filter changed","Smoke, CO, GFCI and shut-off valve checks","Garage door lube and pre-winter weatherproofing","Irrigation blowout","Whole-Home Mold and Moisture Scan"],note:"All systems normal. One slightly elevated moisture reading under the hall bath sink, flagged for a recheck next visit."},
 {id:"v1",date:"Jun 20, 2026",season:"Summer Visit",items:["Smoke and CO detector checks","Furnace filter changed","Water softener salt topped off","Fridge water filter changed","Dryer vent cleaning","Whole-Home Mold and Moisture Scan"],note:"No issues found. Dryer vent airflow improved after cleaning."},

var eq=[["furnace","Gas Furnace","Installed 2014 · 12 yrs","ok","Tuned Sep 2026"],["ac","Central AC","Installed 2014 · 12 yrs","ok","Tuned Apr 2026"],["waterheater","Tank Water Heater, 50 gal","Installed 2019 · 7 yrs","ok","Flushed Apr 2026"],["meter","Water Softener","Installed 2021 · 5 yrs","ok","Salt topped off Sep 2026"],["detector","Smoke and CO Detectors (6)","Replaced 2022 · 4 yrs","ok","Checked Sep 2026"],["dryer","Dryer Vent","","ok","Cleaned Jun 2026"]];
var tabs=[["home","house","Home"],["visits","clipboard","Visits"],["record","doc","Record"],["plan","tag","Plan"],["refer","gift","Refer"],["profile","user","Profile"]];
$("#tabs").innerHTML=tabs.map(function(t){return '<button data-tab="'+t[0]+'">'+I(t[1],"sm")+'<span>'+t[2]+'</span></button>'}).join("");
var V={};
V.home=function(){return '<div class="lbl">Good evening</div><h1 class="hello">Hi, '+M.first+'</h1>'+

V.visits=function(){return '<h2 class="sec">Visits</h2><div class="card"><div class="lbl">Upcoming</div>'+

 '<div class="li">'+I("clock","sm")+'<div class="t"><b>Spring Visit</b><small>Window set in February</small></div><span class="pill warn">Planned</span></div></div>'+
 '<div class="card"><div class="lbl">Past Visits · tap for report</div>'+past.map(function(v){return '<button class="li" data-visit="'+v.id+'">'+I("clipboard","sm")+'<div class="t"><b>'+v.season+'</b><small>'+v.date+' · Written report</small></div><span class="pill ok">Done</span></button>'}).join("")+'</div>'};
function report(id){var v=past.filter(function(x){return x.id===id})[0];return '<button class="back" data-tab="visits">‹ Visits</button><h2 class="sec">'+v.season+' Report</h2><div class="note">'+v.date+' · Licensed Smart Upkeep tech</div>'+
 '<div class="card"><div class="lbl">Checklist</div><ul class="chk">'+v.items.map(function(i){return '<li>'+esc(i)+'</li>'}).join("")+'</ul></div>'+
 '<div class="card"><div class="lbl">Tech Notes</div><p style="margin:6px 0 0">'+esc(v.note)+'</p></div>'+
 '<div class="card"><div class="lbl">Photos</div><div class="ph" style="margin-top:8px"><div>Photo placeholder</div><div>Photo placeholder</div><div>Photo placeholder</div></div></div>'};
/* App Design Deck (Max, 17:43 ICT Oct 15): Appliances First with Label Plus Headline (02), Top Pill Tabs in Saffron (13, 03); Warranty List rows with picture beside (07, 15) as fold-out sections (16, 19); warranty note at the bottom as a solid banner (10, Max note); toasts stay at the bottom (04). */
var recTab="eq";

  '<div class="warr-banner" role="note">'+I("shield","sm")+'<div><b>Warranty Claims</b><br>Your Maintenance Proof Pack is a downloadable, dated visit record for warranty claims.</div></div>',
 scan:'<div class="card"><div class="lbl">Mold and Moisture Scan · Sep 18, 2026</div>'+
 [["Ceilings under bathrooms","Normal","ok"],["Windows","Normal","ok"],["Basement walls","Normal","ok"],["Under kitchen sink","Normal","ok"],["Under hall bath sink","Slightly damp, recheck","warn"]].map(function(r){return '<div class="li"><div class="t"><b>'+r[0]+'</b></div><span class="pill '+r[2]+'">'+r[1]+'</span></div>'}).join("")+
 '<p class="note">Pinless moisture meter and thermal camera readings, with photos. Flags damp spots where mold can grow. Not a lab mold test.</p></div>',
 recall:'<div class="card"><div class="lbl">Recall Monitoring</div><div class="li">'+I("shield","sm")+'<div class="t"><b>6 items monitored</b><small>No open recalls · last checked Oct 14, 2026</small></div><span class="pill ok">Clear</span></div></div>',

 return '<div class="lbl" style="margin-top:10px">Home Record · '+M.addr+'</div><h2 class="sec" style="margin-top:2px">Your Appliances</h2>'+

 var w=W.twoYear;return '<h2 class="sec">Plan &amp; Billing</h2><div class="card plan"><div class="lbl">Current Plan</div><h2>'+T.label+'</h2><div>'+T.tagline+' · '+M.term+'</div></div>'+

 '<div class="card"><div class="lbl">Welcome Offer</div><h3>'+w.freeMonths+' Free Months</h3><p class="note" style="margin:0">'+esc(w.label)+'. Your '+w.freeMonths+' free months are added after your '+w.payMonths+' paid months.</p></div>'+
