<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#FAF6EE;color:#1a1a1a;font-family:Hind,-apple-system,system-ui,sans-serif}

if(document.getElementById('r').checked)localStorage.setItem(w.k,btoa(String.fromCharCode(...raw)));show(t,w.k);return}catch(x){}}}er.textContent='Wrong password. Try again.'}})()</script></body></html>
